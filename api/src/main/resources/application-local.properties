# Activated only when running with --spring.profiles.active=local
# (or SPRING_PROFILES_ACTIVE=local). Safe to commit — these credentials
# only unlock the local docker-compose containers, nothing real.

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.datasource.url=jdbc:mysql://localhost:3306/waitingroom
spring.datasource.username=app_admin
spring.datasource.password=changeme

# Local dev only ? auto-creates/updates tables from the @Entity classes so
# you don't need a migration tool just to run locally. Prod uses
# ddl-auto=validate instead (see application-prod.properties) ? schema
# changes there should be deliberate, via a migration, not automatic.
spring.jpa.hibernate.ddl-auto=update

admin.username=admin
admin.password=changeme

# Auth0 ? replace with your real tenant domain and API identifier once
# you have them from the dashboard.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-tenant.us.auth0.com/
auth0.audience=https://event-ticketing-api


app.cors.allowed-origin=http://localhost:5173

