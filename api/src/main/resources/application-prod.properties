# Activated via --spring.profiles.active=prod (set by the EC2 boot script in Terraform).
# Wiring values have no fallback defaults, on purpose: a missing env var should fail
# the app at startup, not silently fall back to something wrong (e.g. localhost).
# Tuning knobs (waitingroom.*) keep safe defaults so they can be overridden without a rebuild.

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=true

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never auto-create/alter schema in production - schema changes go through Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate

waitingroom.admit-batch-size=${WAITING_ROOM_ADMIT_BATCH_SIZE:50}
waitingroom.admit-interval-ms=${WAITING_ROOM_ADMIT_INTERVAL_MS:5000}
waitingroom.heartbeat-timeout-seconds=${WAITING_ROOM_HEARTBEAT_TIMEOUT_SECONDS:90}
waitingroom.admission-ttl-minutes=${WAITING_ROOM_ADMISSION_TTL_MINUTES:10}
waitingroom.max-active-shoppers=${WAITING_ROOM_MAX_ACTIVE_SHOPPERS:500}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.frontend-url=${APP_FRONTEND_URL}

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
auth0.audience=${AUTH0_AUDIENCE}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# DynamoDB - no endpoint override (defaults to real AWS) and no access keys:
# the EC2 instance's IAM role supplies credentials automatically.
dynamodb.region=${AWS_REGION}