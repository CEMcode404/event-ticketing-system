# Activated via --spring.profiles.active=prod (set by the EC2 boot script
# in Terraform). Every value here is required from the environment — no
# fallback defaults, on purpose. A missing env var should fail the app at
# startup, not silently fall back to something wrong (e.g. localhost).

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=true

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never auto-create/alter schema in production — schema changes should be
# deliberate (Flyway migration), not a side effect of app startup.
spring.jpa.hibernate.ddl-auto=validate

waitingroom.hard-cap=${WAITING_ROOM_HARD_CAP:3000}
waitingroom.stale-after-seconds=${WAITING_ROOM_STALE_AFTER_SECONDS:45}

stripe.api-key=${STRIPE_API_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
auth0.audience=${AUTH0_AUDIENCE}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}